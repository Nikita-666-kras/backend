server:
  port: 9009

spring:
  application:
    name: integrations-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

amocrm:
  ar-field-id: ${AMOCRM_AR_FIELD_ID:1853459}
  webhook-secret: ${AMOCRM_WEBHOOK_SECRET:}
  # Continue body is always { "data": { "ar": "...." } }; Salesbot writes the field via {{json.ar}}

management:
  endpoints:
    web:
      base-path: /application
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
