server:
  port: 9009

spring:
  application:
    name: integrations-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

amocrm:
  base-url: ${AMOCRM_BASE_URL:}
  access-token: ${AMOCRM_ACCESS_TOKEN:}
  ar-field-id: ${AMOCRM_AR_FIELD_ID:1902113}
  phone-field-id: ${AMOCRM_PHONE_FIELD_ID:1844509}
  webhook-secret: ${AMOCRM_WEBHOOK_SECRET:}
  pipeline-enabled: ${AMOCRM_PIPELINE_ENABLED:false}

orders:
  enabled: ${ORDERS_ENABLED:true}
  secret: ${ORDERS_SECRET:}
  pipeline-id: ${AMOCRM_ORDERS_PIPELINE_ID:0}
  status-id: ${AMOCRM_ORDERS_STATUS_ID:0}
  utm-campaign-field-id: ${AMOCRM_UTM_CAMPAIGN_FIELD_ID:1844521}
  utm-referrer-field-id: ${AMOCRM_UTM_REFERRER_FIELD_ID:1844527}
  tag-parts: ${ORDERS_TAG_PARTS:запчасти}
  tag-site: ${ORDERS_TAG_SITE:tilda}

management:
  endpoints:
    web:
      base-path: /application
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
