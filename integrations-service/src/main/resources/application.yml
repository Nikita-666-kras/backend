server:
  port: 9009

spring:
  application:
    name: integrations-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

amocrm:
  base-url: ${AMOCRM_BASE_URL:}
  access-token: ${AMOCRM_ACCESS_TOKEN:}
  ar-field-id: ${AMOCRM_AR_FIELD_ID:1902113}
  phone-field-id: ${AMOCRM_PHONE_FIELD_ID:1844509}
  webhook-secret: ${AMOCRM_WEBHOOK_SECRET:}
  pipeline-enabled: ${AMOCRM_PIPELINE_ENABLED:false}

management:
  endpoints:
    web:
      base-path: /application
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
