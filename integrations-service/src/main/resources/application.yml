server:
  port: 9009

spring:
  application:
    name: integrations-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

amocrm:
  ar-field-id: ${AMOCRM_AR_FIELD_ID:1853459}
  webhook-secret: ${AMOCRM_WEBHOOK_SECRET:}
  # handlers = set_custom_fields via execute_handlers; data_only = only {{json.ar}} for next bot step
  autoar-mode: ${AMOCRM_AUTOAR_MODE:handlers}

management:
  endpoints:
    web:
      base-path: /application
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
