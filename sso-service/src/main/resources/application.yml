server:
  port: 9001

spring:
  application:
    name: sso-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/sso_db}
    username: ${SPRING_DATASOURCE_USERNAME:sso}
    password: ${SPRING_DATASOURCE_PASSWORD:sso}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}
  internal-api-key: ${SSO_INTERNAL_API_KEY:${INTERNAL_API_KEY:local-dev-internal-key}}
  login:
    max-failures: ${LOGIN_MAX_FAILURES:5}
    lockout-minutes: ${LOGIN_LOCKOUT_MINUTES:15}
    ip-limit-per-minute: ${LOGIN_IP_LIMIT_PER_MINUTE:20}
    refresh-limit-per-minute: ${LOGIN_REFRESH_LIMIT_PER_MINUTE:30}
    username-limit-per-minute: ${LOGIN_USERNAME_LIMIT_PER_MINUTE:10}

logging:
  audit:
    enabled: ${LOGGING_AUDIT_ENABLED:false}
    base-url: ${LOGGING_SERVICE_URL:http://logging-service:9008}
    internal-api-key: ${LOGGING_INTERNAL_API_KEY:${INTERNAL_API_KEY}}

app:
  seed-users: ${APP_SEED_USERS:false}
  seed:
    admin-password: ${SEED_ADMIN_PASSWORD:}
    editor-password: ${SEED_EDITOR_PASSWORD:}
    manager-password: ${SEED_MANAGER_PASSWORD:}
    purchaser-password: ${SEED_PURCHASER_PASSWORD:}

management:
  endpoints:
    web:
      base-path: /application
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
