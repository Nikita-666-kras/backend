# Public read-only API gateway (:8081)
# Example: api.atris.site / api.topayu.ru → public-gateway
#
# sudo cp deploy/nginx/public-api.example.conf /etc/nginx/sites-available/api.atris.site
# sudo ln -sf /etc/nginx/sites-available/api.atris.site /etc/nginx/sites-enabled/
# sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.atris.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.atris.site;

    ssl_certificate     /etc/letsencrypt/live/api.atris.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.atris.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    # amoCRM Salesbot webhooks (POST) — must not hit the GET-only guard below
    location /amocrm {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location / {
        # Catalog/blog: GET only at the edge
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 405;
        }
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
