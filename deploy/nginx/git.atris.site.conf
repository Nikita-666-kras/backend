# git.atris.site → GitLab (:8929)
#
# 1) Сначала только HTTP (для certbot) — см. GITLAB_ATRIS.md
# 2) sudo cp deploy/nginx/git.atris.site.conf /etc/nginx/sites-available/git.atris.site
# 3) sudo ln -sf /etc/nginx/sites-available/git.atris.site /etc/nginx/sites-enabled/
# 4) sudo nginx -t && sudo systemctl reload nginx
# 5) sudo certbot --nginx -d git.atris.site

server {
    listen 80;
    listen [::]:80;
    server_name git.atris.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # После выдачи сертификата certbot обычно добавляет редирект.
    # До certbot можно временно проксировать на GitLab:
    location / {
        proxy_pass http://127.0.0.1:8929;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 512m;
    }
}

