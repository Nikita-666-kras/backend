server:
  port: 9005

spring:
  application:
    name: admin-service
  servlet:
    multipart:
      max-file-size: 120MB
      max-request-size: 120MB

post-service:
  base-url: ${POST_SERVICE_URL:http://post-service:9003}

parts-service:
  base-url: ${PARTS_SERVICE_URL:http://parts-service:9006}

proposal-service:
  base-url: ${PROPOSAL_SERVICE_URL:http://proposal-service:9007}

logging-service:
  base-url: ${LOGGING_SERVICE_URL:http://logging-service:9008}

security:
  jwt:
    secret: ${JWT_SECRET}
  internal-api-keys:
    post: ${POST_INTERNAL_API_KEY:${INTERNAL_API_KEY}}
    parts: ${PARTS_INTERNAL_API_KEY:${INTERNAL_API_KEY}}
    proposal: ${PROPOSAL_INTERNAL_API_KEY:${INTERNAL_API_KEY}}
    logging: ${LOGGING_INTERNAL_API_KEY:${INTERNAL_API_KEY}}

logging:
  audit:
    enabled: ${LOGGING_AUDIT_ENABLED:false}
    base-url: ${LOGGING_SERVICE_URL:http://logging-service:9008}
    internal-api-key: ${LOGGING_INTERNAL_API_KEY:${INTERNAL_API_KEY}}

management:
  endpoints:
    web:
      base-path: /application
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
