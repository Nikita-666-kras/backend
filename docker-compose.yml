services:
  post-db:
    image: postgres:16
    environment:
      POSTGRES_DB: post_db
      POSTGRES_USER: post
      POSTGRES_PASSWORD: ${POST_DB_PASSWORD}
    volumes:
      - post-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U post -d post_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - blog-net

  sso-db:
    image: postgres:16
    environment:
      POSTGRES_DB: sso_db
      POSTGRES_USER: sso
      POSTGRES_PASSWORD: ${SSO_DB_PASSWORD}
    volumes:
      - sso-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sso -d sso_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - blog-net

  parts-db:
    image: postgres:16
    environment:
      POSTGRES_DB: parts_db
      POSTGRES_USER: parts
      POSTGRES_PASSWORD: ${PARTS_DB_PASSWORD}
    volumes:
      - parts-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parts -d parts_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - blog-net

  proposal-db:
    image: postgres:16
    environment:
      POSTGRES_DB: proposal_db
      POSTGRES_USER: proposal
      POSTGRES_PASSWORD: ${PROPOSAL_DB_PASSWORD}
    volumes:
      - proposal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proposal -d proposal_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - blog-net

  post-service:
    build:
      context: .
      dockerfile: article-service/Dockerfile
    depends_on:
      post-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://post-db:5432/post_db
      SPRING_DATASOURCE_USERNAME: post
      SPRING_DATASOURCE_PASSWORD: ${POST_DB_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      POST_INTERNAL_API_KEY: ${POST_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      PARTS_INTERNAL_API_KEY: ${PARTS_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      PARTS_SERVICE_URL: http://parts-service:9006
      JWT_SECRET: ${JWT_SECRET}
      MEDIA_STORAGE_PATH: /data/media
      MEDIA_MAX_IMAGE_BYTES: ${MEDIA_MAX_IMAGE_BYTES:-10485760}
      MEDIA_MAX_VIDEO_BYTES: ${MEDIA_MAX_VIDEO_BYTES:-104857600}
      MEDIA_SQUARE_BACKGROUND: ${MEDIA_SQUARE_BACKGROUND:-#ffffff}
      MEDIA_WATERMARK_LOGO_PATH: ${MEDIA_WATERMARK_LOGO_PATH:-watermark.png}
      MEDIA_WATERMARK_OPACITY: ${MEDIA_WATERMARK_OPACITY:-0.20}
      MEDIA_WATERMARK_BG_THRESHOLD: ${MEDIA_WATERMARK_BG_THRESHOLD:-8}
    volumes:
      - media-data:/data/media
    networks:
      - blog-net
    expose:
      - "9003"

  sso-service:
    build:
      context: .
      dockerfile: sso-service/Dockerfile
    depends_on:
      sso-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://sso-db:5432/sso_db
      SPRING_DATASOURCE_USERNAME: sso
      SPRING_DATASOURCE_PASSWORD: ${SSO_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      SSO_INTERNAL_API_KEY: ${SSO_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      LOGIN_IP_LIMIT_PER_MINUTE: ${LOGIN_IP_LIMIT_PER_MINUTE:-20}
      LOGIN_REFRESH_LIMIT_PER_MINUTE: ${LOGIN_REFRESH_LIMIT_PER_MINUTE:-30}
      LOGIN_USERNAME_LIMIT_PER_MINUTE: ${LOGIN_USERNAME_LIMIT_PER_MINUTE:-10}
      APP_SEED_USERS: ${APP_SEED_USERS:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_EDITOR_PASSWORD: ${SEED_EDITOR_PASSWORD:-}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:-}
      SEED_PURCHASER_PASSWORD: ${SEED_PURCHASER_PASSWORD:-}
      LOGGING_AUDIT_ENABLED: ${LOGGING_AUDIT_ENABLED:-true}
      LOGGING_SERVICE_URL: http://logging-service:9008
      LOGGING_INTERNAL_API_KEY: ${LOGGING_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
    networks:
      - blog-net
    expose:
      - "9001"

  parts-service:
    build:
      context: .
      dockerfile: parts-service/Dockerfile
    depends_on:
      parts-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://parts-db:5432/parts_db
      SPRING_DATASOURCE_USERNAME: parts
      SPRING_DATASOURCE_PASSWORD: ${PARTS_DB_PASSWORD}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      POST_INTERNAL_API_KEY: ${POST_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      PARTS_INTERNAL_API_KEY: ${PARTS_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
    networks:
      - blog-net
    expose:
      - "9006"

  proposal-service:
    build:
      context: .
      dockerfile: proposal-service/Dockerfile
    depends_on:
      proposal-db:
        condition: service_healthy
      parts-service:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://proposal-db:5432/proposal_db
      SPRING_DATASOURCE_USERNAME: proposal
      SPRING_DATASOURCE_PASSWORD: ${PROPOSAL_DB_PASSWORD}
      PARTS_SERVICE_URL: http://parts-service:9006
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      PARTS_INTERNAL_API_KEY: ${PARTS_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      PROPOSAL_INTERNAL_API_KEY: ${PROPOSAL_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      KP_STORAGE_PATH: /data/kp
    volumes:
      - kp-data:/data/kp
    networks:
      - blog-net
    expose:
      - "9007"


  logging-service:
    build:
      context: .
      dockerfile: logging-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/logs/logging.db
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      LOGGING_INTERNAL_API_KEY: ${LOGGING_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      LOG_DB_PATH: /data/logs/logging.db
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
      LOG_MAX_ROWS: ${LOG_MAX_ROWS:-100000}
      LOG_MAX_DB_MB: ${LOG_MAX_DB_MB:-256}
    volumes:
      - logs-data:/data/logs
    networks:
      - blog-net
    expose:
      - "9008"

  integrations-service:
    build:
      context: .
      dockerfile: integrations-service/Dockerfile
    environment:
      AMOCRM_AR_FIELD_ID: ${AMOCRM_AR_FIELD_ID:-1902731}
      AMOCRM_PHONE_FIELD_ID: ${AMOCRM_PHONE_FIELD_ID:-1844509}
      AMOCRM_WEBHOOK_SECRET: ${AMOCRM_WEBHOOK_SECRET:-}
      AMOCRM_BASE_URL: ${AMOCRM_BASE_URL:-}
      AMOCRM_ACCESS_TOKEN: ${AMOCRM_ACCESS_TOKEN:-}
      AMOCRM_PIPELINE_ENABLED: ${AMOCRM_PIPELINE_ENABLED:-false}
    networks:
      - blog-net
    expose:
      - "9009"

  admin-service:
    build:
      context: .
      dockerfile: admin-service/Dockerfile
    depends_on:
      - post-service
      - parts-service
      - proposal-service
      - logging-service
    environment:
      POST_SERVICE_URL: http://post-service:9003
      PARTS_SERVICE_URL: http://parts-service:9006
      PROPOSAL_SERVICE_URL: http://proposal-service:9007
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      POST_INTERNAL_API_KEY: ${POST_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      PARTS_INTERNAL_API_KEY: ${PARTS_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      PROPOSAL_INTERNAL_API_KEY: ${PROPOSAL_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      JWT_SECRET: ${JWT_SECRET}
      LOGGING_AUDIT_ENABLED: ${LOGGING_AUDIT_ENABLED:-true}
      LOGGING_SERVICE_URL: http://logging-service:9008
      LOGGING_INTERNAL_API_KEY: ${LOGGING_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
    networks:
      - blog-net
    expose:
      - "9005"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      - sso-service
      - admin-service
      - post-service
      - parts-service
      - proposal-service
      - logging-service
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: admin
      GATEWAY_MODE: admin
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      POST_INTERNAL_API_KEY: ${POST_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      PARTS_INTERNAL_API_KEY: ${PARTS_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      PROPOSAL_INTERNAL_API_KEY: ${PROPOSAL_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      SSO_INTERNAL_API_KEY: ${SSO_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      TOKEN_VERSION_REFRESH_MS: ${TOKEN_VERSION_REFRESH_MS:-1000}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-300}
      RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-20}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088,http://localhost:8090,http://127.0.0.1:8090}
      CORS_ALLOWED_METHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      SSO_SERVICE_URL: http://sso-service:9001
      ADMIN_SERVICE_URL: http://admin-service:9005
      POST_SERVICE_URL: http://post-service:9003
      PARTS_SERVICE_URL: http://parts-service:9006
      PROPOSAL_SERVICE_URL: http://proposal-service:9007
    networks:
      - blog-net

  public-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    depends_on:
      - post-service
      - parts-service
      - integrations-service
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: public
      GATEWAY_MODE: public
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      POST_INTERNAL_API_KEY: ${POST_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      PARTS_INTERNAL_API_KEY: ${PARTS_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
      RATE_LIMIT_ENABLED: ${PUBLIC_RATE_LIMIT_ENABLED:-${RATE_LIMIT_ENABLED:-true}}
      RATE_LIMIT_API_PER_MINUTE: ${PUBLIC_RATE_LIMIT_API_PER_MINUTE:-600}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_CORS_ALLOWED_ORIGINS:-${CORS_ALLOWED_ORIGINS:-http://localhost:8089,http://127.0.0.1:8089}}
      CORS_ALLOWED_METHODS: GET,HEAD,POST,OPTIONS
      POST_SERVICE_URL: http://post-service:9003
      PARTS_SERVICE_URL: http://parts-service:9006
      INTEGRATIONS_SERVICE_URL: http://integrations-service:9009
      SSO_SERVICE_URL: http://sso-service:9001
      SSO_INTERNAL_API_KEY: ${SSO_INTERNAL_API_KEY:-${INTERNAL_API_KEY}}
    networks:
      - blog-net

  admin-ui:
    build:
      context: ./admin-ui
      dockerfile: Dockerfile
    depends_on:
      - api-gateway
    ports:
      - "8088:80"
    networks:
      - blog-net

  public-ui:
    build:
      context: ./public-ui
      dockerfile: Dockerfile
      args:
        VITE_SITE_NAME: ${PUBLIC_SITE_NAME:-Блог АТРИС}
    depends_on:
      - api-gateway
      - public-gateway
    ports:
      - "8089:80"
    networks:
      - blog-net

  manager-ui:
    build:
      context: ./manager-ui
      dockerfile: Dockerfile
    depends_on:
      - api-gateway
    ports:
      - "8090:80"
    networks:
      - blog-net

networks:
  blog-net:
    driver: bridge

volumes:
  post-db-data:
  sso-db-data:
  parts-db-data:
  proposal-db-data:
  media-data:
  kp-data:
  logs-data:



