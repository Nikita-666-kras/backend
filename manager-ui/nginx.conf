server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /auth/ {
        proxy_pass http://api-gateway:8080/auth/;
        proxy_set_header Host $host;
    }

    location /manager/ {
        proxy_pass http://api-gateway:8080/manager/;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
