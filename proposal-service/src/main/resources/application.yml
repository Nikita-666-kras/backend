server:
  port: 9007

spring:
  application:
    name: proposal-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5436/proposal_db}
    username: ${SPRING_DATASOURCE_USERNAME:proposal}
    password: ${SPRING_DATASOURCE_PASSWORD:proposal}
  flyway:
    enabled: true

parts-service:
  base-url: ${PARTS_SERVICE_URL:http://parts-service:9006}

security:
  internal-api-key: ${PROPOSAL_INTERNAL_API_KEY:${INTERNAL_API_KEY}}
  internal-api-keys:
    parts: ${PARTS_INTERNAL_API_KEY:${INTERNAL_API_KEY}}

storage:
  kp-dir: ${KP_STORAGE_PATH:/data/kp}

management:
  endpoints:
    web:
      base-path: /application
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
