# Single-gateway fallback (local / transition). Prefer admin + public split in prod.
spring:
  cloud:
    gateway:
      routes:
        - id: sso-service
          uri: ${SSO_SERVICE_URL:http://sso-service:9001}
          predicates:
            - Path=/auth/**
        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://admin-service:9005}
          predicates:
            - Path=/admin/**
        - id: post-service
          uri: ${POST_SERVICE_URL:http://post-service:9003}
          predicates:
            - Path=/posts/**
        - id: media-public
          uri: ${POST_SERVICE_URL:http://post-service:9003}
          predicates:
            - Path=/media/**
        - id: parts-public
          uri: ${PARTS_SERVICE_URL:http://parts-service:9006}
          predicates:
            - Path=/parts/**
        - id: kits-public
          uri: ${PARTS_SERVICE_URL:http://parts-service:9006}
          predicates:
            - Path=/kits/**
        - id: drones-public
          uri: ${PARTS_SERVICE_URL:http://parts-service:9006}
          predicates:
            - Path=/drones/**
        - id: part-categories-public
          uri: ${PARTS_SERVICE_URL:http://parts-service:9006}
          predicates:
            - Path=/part-categories/**
        - id: proposal-manager
          uri: ${PROPOSAL_SERVICE_URL:http://proposal-service:9007}
          predicates:
            - Path=/manager/kp/**
        - id: integrations-amocrm
          uri: ${INTEGRATIONS_SERVICE_URL:http://integrations-service:9009}
          predicates:
            - Path=/amocrm,/amocrm/**
        - id: integrations-orders
          uri: ${INTEGRATIONS_SERVICE_URL:http://integrations-service:9009}
          predicates:
            - Path=/public/orders,/public/orders/**
