server:
  port: 8080

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 120MB
  cloud:
    gateway:
      routes:
        - id: sso-service
          uri: ${SSO_SERVICE_URL:http://sso-service:9001}
          predicates:
            - Path=/auth/**
        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://admin-service:9005}
          predicates:
            - Path=/admin/**
        - id: post-service
          uri: ${POST_SERVICE_URL:http://post-service:9003}
          predicates:
            - Path=/posts/**
        - id: media-public
          uri: ${POST_SERVICE_URL:http://post-service:9003}
          predicates:
            - Path=/media/**
        - id: parts-public
          uri: ${PARTS_SERVICE_URL:http://parts-service:9006}
          predicates:
            - Path=/parts/**
        - id: kits-public
          uri: ${PARTS_SERVICE_URL:http://parts-service:9006}
          predicates:
            - Path=/kits/**
        - id: drones-public
          uri: ${PARTS_SERVICE_URL:http://parts-service:9006}
          predicates:
            - Path=/drones/**
        - id: part-categories-public
          uri: ${PARTS_SERVICE_URL:http://parts-service:9006}
          predicates:
            - Path=/part-categories/**
        - id: proposal-manager
          uri: ${PROPOSAL_SERVICE_URL:http://proposal-service:9007}
          predicates:
            - Path=/manager/kp/**

security:
  jwt:
    secret: ${JWT_SECRET}
  internal-api-keys:
    post: ${POST_INTERNAL_API_KEY:${INTERNAL_API_KEY}}
    parts: ${PARTS_INTERNAL_API_KEY:${INTERNAL_API_KEY}}
    proposal: ${PROPOSAL_INTERNAL_API_KEY:${INTERNAL_API_KEY}}
    sso: ${SSO_INTERNAL_API_KEY:${INTERNAL_API_KEY}}
  token-version:
    refresh-ms: ${TOKEN_VERSION_REFRESH_MS:1000}
  rate-limit:
    api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:300}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    cleanup-ms: ${RATE_LIMIT_CLEANUP_MS:60000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088}

management:
  endpoints:
    web:
      base-path: /application
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
