server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    default: combined
  codec:
    max-in-memory-size: 120MB
  cloud:
    gateway:
      # Routes: application-{admin|public|combined}.yml via SPRING_PROFILES_ACTIVE

gateway:
  # admin | public | combined — must match SPRING_PROFILES_ACTIVE
  mode: ${GATEWAY_MODE:combined}

security:
  jwt:
    secret: ${JWT_SECRET}
  internal-api-keys:
    post: ${POST_INTERNAL_API_KEY:${INTERNAL_API_KEY}}
    parts: ${PARTS_INTERNAL_API_KEY:${INTERNAL_API_KEY}}
    proposal: ${PROPOSAL_INTERNAL_API_KEY:${INTERNAL_API_KEY}}
    sso: ${SSO_INTERNAL_API_KEY:${INTERNAL_API_KEY}}
  token-version:
    refresh-ms: ${TOKEN_VERSION_REFRESH_MS:1000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    api-per-minute: ${RATE_LIMIT_API_PER_MINUTE:300}
    auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:20}
    cleanup-ms: ${RATE_LIMIT_CLEANUP_MS:60000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}

management:
  endpoints:
    web:
      base-path: /application
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
