# Admin / manager gateway — JWT CRUD. No public catalog write surface.
spring:
  cloud:
    gateway:
      routes:
        - id: sso-service
          uri: ${SSO_SERVICE_URL:http://sso-service:9001}
          predicates:
            - Path=/auth/**
        - id: admin-service
          uri: ${ADMIN_SERVICE_URL:http://admin-service:9005}
          predicates:
            - Path=/admin/**
        - id: proposal-manager
          uri: ${PROPOSAL_SERVICE_URL:http://proposal-service:9007}
          predicates:
            - Path=/manager/kp/**
        # Previews in admin-ui (same-origin /media/{uuid})
        - id: media-admin-preview
          uri: ${POST_SERVICE_URL:http://post-service:9003}
          predicates:
            - Path=/media/**
            - Method=GET,HEAD,OPTIONS
