# Public read-only API. Mutations rejected by PublicReadOnlyFilter (405).
# Do not put Method= predicates here — unmatched methods would 404 before the filter.
spring:
  cloud:
    gateway:
      routes:
        - id: post-service-public
          uri: ${POST_SERVICE_URL:http://post-service:9003}
          predicates:
            - Path=/posts,/posts/**
        - id: media-public
          uri: ${POST_SERVICE_URL:http://post-service:9003}
          predicates:
            - Path=/media,/media/**
        - id: parts-public
          uri: ${PARTS_SERVICE_URL:http://parts-service:9006}
          predicates:
            - Path=/parts,/parts/**
        - id: kits-public
          uri: ${PARTS_SERVICE_URL:http://parts-service:9006}
          predicates:
            - Path=/kits,/kits/**
        - id: drones-public
          uri: ${PARTS_SERVICE_URL:http://parts-service:9006}
          predicates:
            - Path=/drones,/drones/**
        - id: part-categories-public
          uri: ${PARTS_SERVICE_URL:http://parts-service:9006}
          predicates:
            - Path=/part-categories,/part-categories/**
        - id: integrations-amocrm
          uri: ${INTEGRATIONS_SERVICE_URL:http://integrations-service:9009}
          predicates:
            - Path=/amocrm,/amocrm/**
