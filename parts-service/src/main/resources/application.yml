server:
  port: 9006

spring:
  application:
    name: parts-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/parts_db}
    username: ${SPRING_DATASOURCE_USERNAME:parts}
    password: ${SPRING_DATASOURCE_PASSWORD:parts}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

security:
  internal-api-key: ${PARTS_INTERNAL_API_KEY:${INTERNAL_API_KEY}}

management:
  endpoints:
    web:
      base-path: /application
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
